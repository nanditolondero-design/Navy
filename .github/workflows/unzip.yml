name: Descomprimir ZIP y compilar

on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    outputs:
      unzipped: ${{ steps.unzip.outputs.unzipped }}
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir los ZIP de la raíz en el repo
        id: unzip
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No hay ZIPs para descomprimir"
            echo "unzipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Descomprimiendo $z"
            unzip -o -q "$z" -d .
            git rm -q -f "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descomprimir ${zips[*]}"

          # Si alguien hizo push mientras corría el workflow, se integra y se reintenta
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Reintento $i..."
            sleep 3
          done
          git push --dry-run origin "HEAD:${GITHUB_REF_NAME}" >/dev/null 2>&1 || { echo "No se pudo subir el commit"; exit 1; }
          echo "unzipped=true" >> "$GITHUB_OUTPUT"

  build:
    needs: unzip
    if: needs.unzip.outputs.unzipped == 'true'
    uses: ./.github/workflows/build.yml

  screenshots:
    needs: [unzip, build]
    if: needs.unzip.outputs.unzipped == 'true'
    uses: ./.github/workflows/screenshots.yml
